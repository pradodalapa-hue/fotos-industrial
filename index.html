
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Dony Burguer's - Tempo Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">
    <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <span class="inline-block w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
            <h1 class="text-lg font-bold text-yellow-400">DONY BURGUER'S - CENTRAL MULTI-CHAT</h1>
        </div>
        <span id="status-conexao" class="text-xs bg-gray-800 px-3 py-1 rounded text-gray-400">Conectando...</span>
    </header>
    <section class="bg-gray-900/60 border-b border-gray-800 p-3 overflow-x-auto">
        <div class="container mx-auto flex items-center space-x-4 min-w-max" id="barra-bolinhas">
            <span class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Novas Conversas:</span>
            <div id="container-bolinhas" class="flex space-x-3">
                <span class="text-xs text-gray-500 italic">Nenhuma nova notificação</span>
            </div>
        </div>
    </section>
    <main id="view-lista" class="container mx-auto p-4 max-w-4xl flex-1">
        <h2 class="text-xl font-semibold mb-4 text-gray-200 border-b border-gray-800 pb-2">Fila de Atendimento</h2>
        <div id="lista-conversas" class="space-y-4">
            <div class="text-center text-gray-500 py-10">Aguardando mensagens do WhatsApp...</div>
        </div>
    </main>
    <div id="view-chat" class="hidden flex-1 flex flex-col h-[calc(100vh-65px)] bg-gray-950">
        <div class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center shadow">
            <div class="flex items-center space-x-3">
                <button onclick="voltarParaLista()" class="bg-gray-800 hover:bg-gray-700 text-yellow-400 px-3 py-1 rounded text-sm font-bold">⬅ Voltar</button>
                <div>
                    <h3 id="chat-nome-cliente" class="font-bold text-lg text-yellow-400">Cliente</h3>
                    <span class="text-xs text-green-400 flex items-center gap-1">● Atendimento Humano Ativo na Tela</span>
                </div>
            </div>
            <button onclick="encerrarAtendimento()" class="bg-red-600 hover:bg-red-700 text-white text-xs sm:text-sm font-bold px-4 py-2 rounded shadow transition">
                🛑 Encerrar Atendimento
            </button>
        </div>
        <div id="chat-mensagens" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-950/80"></div>
        <div class="bg-gray-900 border-t border-gray-800 p-3 flex gap-2">
            <input type="text" id="input-mensagem-chat" placeholder="Digite sua resposta para o cliente..." class="flex-1 bg-gray-950 border border-gray-800 rounded px-4 py-2 text-white focus:outline-none focus:border-yellow-500">
            <button onclick="enviarMensagemChat()" class="bg-yellow-500 hover:bg-yellow-600 text-gray-950 font-bold px-6 py-2 rounded transition">Enviar</button>
        </div>
    </div>
    <script>
        const firebaseConfig = { databaseURL: "https://dony-burguers-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const lojaId = "DONY_BURGUERS_01";
        const listaConversasEl = document.getElementById('lista-conversas');
        const containerBolinhasEl = document.getElementById('container-bolinhas');
        const statusConexaoEl = document.getElementById('status-conexao');
        const viewLista = document.getElementById('view-lista');
        const viewChat = document.getElementById('view-chat');
        const chatMensagensEl = document.getElementById('chat-mensagens');
        const chatNomeClienteEl = document.getElementById('chat-nome-cliente');
        let clienteAtualId = null;
        let clienteAtualNome = null;

        db.ref(".info/connected").on("value", (snap) => {
            if (snap.val() === true) {
                statusConexaoEl.textContent = "Online / Conectado";
                statusConexaoEl.className = "text-xs bg-green-900 text-green-300 px-3 py-1 rounded";
            } else {
                statusConexaoEl.textContent = "Desconectado";
                statusConexaoEl.className = "text-xs bg-red-900 text-red-300 px-3 py-1 rounded";
            }
        });

        const pedidosRef = db.ref(`lojas/${lojaId}/pedidos_whatsapp`);
        pedidosRef.on('value', (snapshot) => {
            const dados = snapshot.val();
            listaConversasEl.innerHTML = '';
            containerBolinhasEl.innerHTML = '';
            if (!dados) {
                listaConversasEl.innerHTML = '<div class="text-center text-gray-500 py-10">Nenhuma conversa registrada ainda.</div>';
                containerBolinhasEl.innerHTML = '<span class="text-xs text-gray-500 italic">Nenhuma nova notificação</span>';
                return;
            }
            const chaves = Object.keys(dados).reverse();
            let temBolinhas = false;
            chaves.forEach((id) => {
                const pedido = dados[id];
                const horaFormatada = pedido.hora || new Date(pedido.timestamp).toLocaleTimeString();
                if (pedido.status !== "ENCERRADO") {
                    temBolinhas = true;
                    const bolinha = document.createElement('button');
                    bolinha.className = "flex items-center space-x-2 bg-gray-800 hover:bg-gray-700 border border-yellow-500/40 px-3 py-1.5 rounded-full shadow transition text-xs";
                    bolinha.innerHTML = `<span class="w-2.5 h-2.5 bg-yellow-400 rounded-full animate-ping"></span><span class="font-bold text-white">${pedido.cliente}</span>`;
                    bolinha.onclick = () => abrirChatInterno(id, pedido.cliente);
                    containerBolinhasEl.appendChild(bolinha);
                }
                let badgeColor = "bg-yellow-900 text-yellow-300";
                if (pedido.status === "ASSUMIDO_HUMANO") badgeColor = "bg-purple-900 text-purple-300";
                if (pedido.status === "PROCESSADO") badgeColor = "bg-blue-900 text-blue-300";

                const card = document.createElement('div');
                card.className = "bg-gray-900 border border-gray-800 rounded-lg p-4 shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition";
                card.innerHTML = `
                    <div class="space-y-1 flex-1">
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-lg text-yellow-400">👤 ${pedido.cliente}</span>
                            <span class="text-xs px-2 py-0.5 rounded uppercase font-semibold ${badgeColor}">${pedido.status}</span>
                        </div>
                        <p class="text-gray-300 bg-gray-950 p-3 rounded border border-gray-800 text-sm">"${pedido.conteudo}"</p>
                        <span class="text-xs text-gray-500">Recebido às: ${horaFormatada}</span>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                        <button onclick="abrirChatInterno('${id}', '${pedido.cliente}')" class="bg-green-600 hover:bg-green-700 text-white font-bold text-sm px-4 py-2 rounded transition shadow">
                            💬 Atender na Tela
                        </button>
                    </div>
                `;
                listaConversasEl.appendChild(card);
            });
            if (!temBolinhas) containerBolinhasEl.innerHTML = '<span class="text-xs text-gray-500 italic">Nenhuma nova notificação</span>';
        });

        function abrirChatInterno(idPedido, nomeCliente) {
            clienteAtualId = idPedido;
            clienteAtualNome = nomeCliente;
            chatNomeClienteEl.textContent = nomeCliente;
            db.ref(`lojas/${lojaId}/pedidos_whatsapp/${idPedido}`).update({ status: "ASSUMIDO_HUMANO" });
            viewLista.classList.add('hidden');
            viewChat.classList.remove('hidden');
            carregarMensagensChat(nomeCliente);
        }

        function voltarParaLista() {
            viewChat.classList.add('hidden');
            viewLista.classList.remove('hidden');
        }

        function carregarMensagensChat(nomeCliente) {
            chatMensagensEl.innerHTML = '<div class="text-center text-gray-500 py-4">Carregando conversa...</div>';
            db.ref(`lojas/${lojaId}/pedidos_whatsapp`).orderByChild("cliente").equalTo(nomeCliente).on("value", (snapshot) => {
                chatMensagensEl.innerHTML = '';
                const mensagens = snapshot.val();
                if (!mensagens) {
                    chatMensagensEl.innerHTML = '<div class="text-center text-gray-500 py-4">Nenhuma mensagem nesta conversa.</div>';
                    return;
                }
                Object.values(mensagens).forEach((msg) => {
                    const bubble = document.createElement('div');
                    bubble.className = "p-3 rounded-lg max-w-[80%] text-sm bg-gray-900 border border-gray-800 text-gray-200 shadow";
                    bubble.innerHTML = `<strong>${msg.cliente}:</strong> ${msg.conteudo} <span class="block text-[10px] text-gray-500 mt-1">${msg.hora || ''}</span>`;
                    chatMensagensEl.appendChild(bubble);
                });
                chatMensagensEl.scrollTop = chatMensagensEl.scrollHeight;
            });
        }

        function enviarMensagemChat() {
            const input = document.getElementById('input-mensagem-chat');
            const texto = input.value.trim();
            if (!texto) return;

            // 1. Grava no histórico visível do chat
            db.ref(`lojas/${lojaId}/pedidos_whatsapp`).push({
                cliente: clienteAtualNome,
                conteudo: "👨‍💻 Atendente: " + texto,
                status: "ASSUMIDO_HUMANO",
                timestamp: Date.now(),
                hora: new Date().toLocaleTimeString()
            });

            // 2. Grava na fila de pendentes para o loop de 2s do robô processar e enviar
            db.ref(`lojas/${lojaId}/respostas_pendentes`).push({
                cliente: clienteAtualNome,
                mensagem: "👨‍💻 Atendente: " + texto,
                timestamp: Date.now()
            }).then(() => {
                input.value = '';
            });
        }

        function encerrarAtendimento() {
            if (confirm(`Deseja encerrar o atendimento de ${clienteAtualNome}?`)) {
                db.ref(`lojas/${lojaId}/pedidos_whatsapp/${clienteAtualId}`).update({ status: "ENCERRADO" }).then(() => {
                    alert("Atendimento encerrado!");
                    voltarParaLista();
                });
            }
        }
    </script>
</body>
</html>
